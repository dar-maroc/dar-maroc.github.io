<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page introuvable | DarMaroc</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="canonical" href="https://dar-maroc.github.io/404.html">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Raleway:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F0F0F;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(212,175,55,0.12), transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(212,175,55,0.08), transparent 55%);
      font-family: 'Raleway', sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    .code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #E8C84A, #D4AF37, #8A6D1F);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
    }
    .pattern {
      font-size: 2.5rem;
      margin: 8px 0 20px;
      letter-spacing: 14px;
      color: #D4AF37;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    p { color: rgba(255,255,255,0.75); font-size: 1.05rem; line-height: 1.7; margin-bottom: 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 50px;
      background: linear-gradient(135deg, #E8C84A, #D4AF37);
      color: #111;
      font-weight: 800;
      text-decoration: none;
      font-size: 1rem;
      transition: transform .25s, box-shadow .25s;
      box-shadow: 0 8px 25px rgba(212,175,55,0.35);
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(212,175,55,0.5); }
    .links { margin-top: 26px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: .9rem; transition: color .2s; }
    .links a:hover { color: #D4AF37; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="pattern">❖ ❖ ❖</div>
    <h1 data-fr="Oups ! Page introuvable" data-ar="عذراً! الصفحة غير موجودة">Oups ! Page introuvable</h1>
    <p data-fr="La page que vous cherchez n'existe plus ou a été déplacée. Retournez à l'accueil pour découvrir nos services."
       data-ar="الصفحة التي تبحث عنها غير موجودة أو تم نقلها. عد إلى الرئيسية لاكتشاف خدماتنا.">
      La page que vous cherchez n'existe plus ou a été déplacée. Retournez à l'accueil pour découvrir nos services.
    </p>
    <a href="index.html" class="btn">
      <span data-fr="Retour à l'accueil" data-ar="العودة إلى الرئيسية">Retour à l'accueil</span>
    </a>
    <div class="links">
      <a href="services.html" data-fr="Services" data-ar="الخدمات">Services</a>
      <a href="properties.html" data-fr="Propriétés" data-ar="العقارات">Propriétés</a>
      <a href="contact.html" data-fr="Contact" data-ar="اتصل بنا">Contact</a>
    </div>
  </div>

  <script>
    (function () {
      var lang = 'fr';
      try { lang = localStorage.getItem('darmaroc-lang') || 'fr'; } catch (e) {}
      if (lang === 'ar') {
        document.documentElement.dir = 'rtl';
        document.documentElement.lang = 'ar';
        document.querySelectorAll('[data-ar]').forEach(function (el) {
          if (el.tagName === 'META') { el.setAttribute('content', el.getAttribute('data-ar')); }
          else if (!el.querySelector('*')) el.textContent = el.getAttribute('data-ar');
        });
      }
    })();
  </script>
</body>
</html>
